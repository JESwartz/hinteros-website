<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact HinterOS</title>
  <meta name="description" content="Report a HinterOS bug, find the source code or send an email to the project.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script src="/site.js" defer></script>
</head>
<body>
{{header}}
  <main class="wrap page prose">
    <h1>Contact</h1>
    <dl class="tech contact">
      <dt>Bugs and features</dt>
      <dd>Open an issue on the <a href="{{forge}}/hinteros/issues">issue tracker</a>. For an installation problem, attach the installer logs. Refer to <a href="/docs/troubleshooting/">Troubleshooting</a>.</dd>
      <dt>Source code</dt>
      <dd><a href="{{forge}}">git.hinteros.org</a>, with a mirror on <a href="{{github}}">GitHub</a>.</dd>
      <dt>Email</dt>
      <dd><a href="mailto:contact@hinteros.org">contact@hinteros.org</a></dd>
    </dl>
  </main>
{{footer}}
</body>
</html>
